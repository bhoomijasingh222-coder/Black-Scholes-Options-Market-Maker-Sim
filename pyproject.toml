[project]
name = "options-market-maker"
version = "1.0.0"
description = "Reproducible Black-Scholes options pricing and market-making simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.scripts]
options-mm = "options_mm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

